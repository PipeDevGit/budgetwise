name: Revision automatica de PR

# Revisa cada Pull Request y deja comentarios inline con lo que haya que cambiar.
#
# Autenticacion: usa CLAUDE_CODE_OAUTH_TOKEN, que corre contra la suscripcion de
# Claude y NO contra creditos de la API de pago. Para generarlo, en una terminal:
#   claude setup-token
# y cargar el resultado en Settings -> Secrets and variables -> Actions como
# CLAUDE_CODE_OAUTH_TOKEN. Requiere ademas instalar la Claude GitHub App:
#   https://github.com/apps/claude
#
# Si el secreto no esta cargado, el paso se salta y el PR no se bloquea.
# El comentario del agente NO cuenta como la aprobacion que exige la proteccion
# de rama: un compañero tiene que leer el review y aprobar. Ver CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        if: ${{ env.HAS_TOKEN == 'true' }}
        with:
          fetch-depth: 1

      - name: Revisar el PR
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Revisa el diff de este Pull Request contra las reglas de CLAUDE.md,
            que esta en la raiz del repositorio. Leelo primero.

            Prioriza, en este orden:
            1. Logica de negocio que quedo en el controller en vez de service/.
            2. Consultas que no filtran por el usuario autenticado.
            3. Logica nueva sin prueba unitaria.
            4. Dependencias nuevas en pom.xml o package.json.
            5. Funcionalidad fuera del alcance del MVP (ver exclusiones en CLAUDE.md).
            6. Secretos o credenciales commiteados.

            Publica cada hallazgo como comentario inline en la linea exacta, con la
            herramienta mcp__github_inline_comment__create_inline_comment.
            Escribi en español, se breve y comenta solo lo que hay que cambiar.
            Si no encontras nada, no comentes.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git diff:*)" --max-turns 20'

      - name: Aviso si falta el secreto
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::notice::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN. Ver el encabezado de este workflow."
