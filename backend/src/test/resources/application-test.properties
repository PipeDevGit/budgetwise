# Las pruebas corren contra H2 en memoria: no dependen de un Postgres levantado.
spring.datasource.url=jdbc:h2:mem:budgetwise;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
budgetwise.cors.allowed-origin=http://localhost:5173
