spring.application.name=budgetwise

# Base de datos. Los valores por defecto apuntan al Postgres del docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/budgetwise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:budgetwise}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:budgetwise_dev}

# Hibernate crea y actualiza las tablas al arrancar. Alcanza para un MVP; en un
# producto real esto seria Flyway o Liquibase con migraciones versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origen del frontend en desarrollo. Se sobreescribe con la variable de entorno
# BUDGETWISE_CORS_ALLOWED_ORIGIN en el docker-compose.
budgetwise.cors.allowed-origin=${BUDGETWISE_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JWT de sesion (issue #4, D-08): HS256, 24 horas, sin refresh token.
# El secreto por defecto es solo para desarrollo, igual que la contrasena de Postgres.
budgetwise.jwt.secret=${BUDGETWISE_JWT_SECRET:clave-de-desarrollo-budgetwise-cambiar-en-produccion-2026}
budgetwise.jwt.expiration-hours=${BUDGETWISE_JWT_EXPIRATION_HOURS:24}

# Observabilidad (issue #19): por ahora solo health e info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
