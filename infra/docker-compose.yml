services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budgetwise
      POSTGRES_USER: budgetwise
      POSTGRES_PASSWORD: ${DB_PASSWORD:-budgetwise_dev}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetwise"]
      interval: 5s
      retries: 10

  api:
    build: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/budgetwise
      SPRING_DATASOURCE_USERNAME: budgetwise
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-budgetwise_dev}
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion-clave-de-desarrollo-larga}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}

  web:
    build: ../frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
