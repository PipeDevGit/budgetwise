# Punto de entrada a la API.
#
# El Service es una direccion estable delante de las replicas: los pods se
# crean y se destruyen con IPs distintas, pero "budgetwise-api" siempre
# resuelve, y el trafico se reparte entre los pods que estan "ready".
#
# Tipo NodePort porque esto se prueba en minikube o kind, sin balanceador de
# nube. En un cluster real seria LoadBalancer, o un Ingress por delante.
apiVersion: v1
kind: Service
metadata:
  name: budgetwise-api
spec:
  type: NodePort
  selector:
    app: budgetwise-api
  ports:
    - port: 8080        # puerto del Service dentro del cluster
      targetPort: 8080  # puerto del contenedor
      nodePort: 30080   # puerto expuesto en el nodo, desde afuera
